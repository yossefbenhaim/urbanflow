worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend upstream — load balancer ready (add backend_2, backend_3 here later)
    upstream backend {
        server backend:3000;
        # server backend_2:3000;  ← הוסף בעתיד בלי לשנות כלום אחר
    }

    # Rate limiting — הגנה על ה-API
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 1️⃣ API → proxy to backend
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Service worker — MUST never be long-cached. Browsers that hold an
        # immutable sw.js refuse to fetch updates for the whole cache
        # lifetime, so every deploy silently keeps users on stale JS.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
        }

        # HTML shell — must always revalidate so it can reference the
        # freshest hashed /assets/*.js bundle after a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
        }

        # 2️⃣ React static files
        location / {
            try_files $uri $uri/ /index.html;

            # Hashed assets (Vite adds a content hash to every filename)
            # are safe to cache forever.
            location ~* ^/assets/.*\.(js|css|png|jpg|svg|ico|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
