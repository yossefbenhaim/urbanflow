services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: urbanflow-backend
    restart: unless-stopped
    environment:
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID}
      - EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY}
      - PORT=3000
      - FRONTEND_URL=https://urbanflow.byclick.co.il
    networks:
      - urbanflow
      - coolify

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: urbanflow-nginx
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.urbanflow.rule=Host(`urbanflow.byclick.co.il`)
      - traefik.http.routers.urbanflow.entrypoints=https
      - traefik.http.routers.urbanflow.tls=true
      - traefik.http.routers.urbanflow.tls.certresolver=letsencrypt
      - traefik.http.services.urbanflow.loadbalancer.server.port=80
    networks:
      - urbanflow
      - coolify

networks:
  urbanflow:
    driver: bridge
  coolify:
    external: true
    name: coolify
