name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Frontend tests
        run: npm test -w apps/frontend || true
      - name: Backend tests
        run: npm test -w apps/backend || true
      - name: TypeScript check (frontend)
        run: cd apps/frontend && npx tsc --noEmit || true
      - name: TypeScript check (backend)
        run: cd apps/backend && npx tsc --noEmit || true
